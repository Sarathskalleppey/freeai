<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Renders assistant markdown (headers, bold, lists, links, code blocks)
     the way Claude/ChatGPT do, instead of showing raw ** and ### symbols. -->
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<script>
  // Applied before first paint so switching themes doesn't flash the old one.
  (function(){
    var saved = localStorage.getItem('freeai_theme') || 'dark';
    var effective = saved;
    if(saved === 'system'){
      effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'browser';
    }
    document.documentElement.setAttribute('data-theme', effective);
  })();
</script>
<style>
  :root, html[data-theme="dark"]{
    --bg:#0B0D10;
    --bg-side:#0E1013;
    --bg-elev:#15181C;
    --bg-elev-2:#1C2025;
    --bg-elev-3:#22262B;
    --border:#262B31;
    --border-soft:#1D2126;
    --text:#ECEEF0;
    --text-dim:#9AA0A8;
    --text-faint:#5B6169;
    --accent:#FFB238;
    --accent-2:#FF7A45;
    --accent-soft:rgba(255,178,56,0.13);
    --teal:#4FD1C5;
    --violet:#9B8CFF;
    --danger:#FF6B6B;
    --topbar-bg:transparent;
    --topbar-fg:var(--text-dim);
    --topbar-fg-dim:var(--text-faint);
    --topbar-pill-bg:var(--bg-elev);
    --radius-lg:20px;
    --radius-md:12px;
    --radius-sm:8px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  /* Claude-style theme — warm cream background, terracotta accent */
  html[data-theme="claude"]{
    --bg:#F5F1EA; --bg-side:#EEE8DB; --bg-elev:#FFFFFF; --bg-elev-2:#F1EBDD;
    --bg-elev-3:#E6DEC9; --border:#E0D6BF; --border-soft:#EAE2CE;
    --text:#3D3929; --text-dim:#6B6656; --text-faint:#A39C89;
    --accent:#C15F3C; --accent-2:#D97757; --accent-soft:rgba(193,95,60,0.14);
    --danger:#D14D4D;
    --topbar-bg:transparent; --topbar-fg:var(--text-dim); --topbar-fg-dim:var(--text-faint);
    --topbar-pill-bg:var(--bg-elev);
  }
  /* Browser theme — plain light UI, like a stock browser chrome */
  html[data-theme="browser"]{
    --bg:#FFFFFF; --bg-side:#F7F7F8; --bg-elev:#FFFFFF; --bg-elev-2:#F1F3F5;
    --bg-elev-3:#E7EAEE; --border:#DADCE0; --border-soft:#E8EAED;
    --text:#202124; --text-dim:#5F6368; --text-faint:#9AA0A6;
    --accent:#1A73E8; --accent-2:#1967D2; --accent-soft:rgba(26,115,232,0.12);
    --danger:#D93025;
    --topbar-bg:transparent; --topbar-fg:var(--text-dim); --topbar-fg-dim:var(--text-faint);
    --topbar-pill-bg:var(--bg-elev);
  }
  /* Classic Blue — dark blue top bar, white page, black text */
  html[data-theme="classic-blue"]{
    --bg:#FFFFFF; --bg-side:#F7F9FC; --bg-elev:#FFFFFF; --bg-elev-2:#F0F3F8;
    --bg-elev-3:#E3E8F0; --border:#D5DCE6; --border-soft:#E9EDF3;
    --text:#000000; --text-dim:#333333; --text-faint:#6B7280;
    --accent:#0B3D91; --accent-2:#1657B0; --accent-soft:rgba(11,61,145,0.10);
    --danger:#C53030;
    --topbar-bg:#0B2447; --topbar-fg:#FFFFFF; --topbar-fg-dim:#C9D6EA;
    --topbar-pill-bg:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  ::selection{background:var(--accent-soft); color:var(--accent);}
  button{font-family:inherit; cursor:pointer; background:none; border:none; color:inherit;}
  input,textarea{font-family:inherit; color:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--bg-elev-3); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns:264px 1fr;
    height:100vh;
    width:100vw;
    position:relative;
    transition:grid-template-columns .22s ease;
  }
  .app.sidebar-collapsed{
    grid-template-columns:0px 1fr;
  }
  .app.sidebar-collapsed .sidebar{
    padding-left:0; padding-right:0;
    opacity:0;
    pointer-events:none;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--bg-side);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    padding:18px 14px;
    height:100%;
    overflow:hidden;
    transition:margin-left .25s ease, padding .22s ease, opacity .18s ease;
  }
  .sidebar-collapse-btn{
    margin-left:auto; flex-shrink:0;
    color:var(--text-faint);
    padding:5px; border-radius:var(--radius-sm);
  }
  .sidebar-collapse-btn:hover{background:var(--bg-elev); color:var(--text);}
  .sidebar-restore-btn{
    position:fixed; top:16px; left:16px; z-index:70;
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    box-shadow:0 6px 18px -6px rgba(0,0,0,0.4);
  }
  .sidebar-restore-btn:hover{color:var(--text); border-color:var(--accent-2);}
  @media (max-width:820px){
    .sidebar-collapse-btn, .sidebar-restore-btn{display:none !important;}
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:4px 6px 18px 6px;
  }
  .brand-mark{width:26px; height:26px; flex-shrink:0;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:0.2px;}
  .brand-sub{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); letter-spacing:0.3px;}

  .new-chat-btn{
    display:flex; align-items:center; gap:9px;
    width:100%;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:var(--bg-elev);
    color:var(--text);
    font-size:13.5px;
    font-weight:500;
    transition:background .15s, border-color .15s;
    margin-bottom:14px;
  }
  .new-chat-btn:hover{background:var(--bg-elev-2); border-color:var(--accent-2);}
  .new-chat-btn svg{flex-shrink:0;}

  .side-search{
    display:flex; align-items:center; gap:8px;
    padding:7px 10px;
    border-radius:var(--radius-sm);
    background:var(--bg-elev);
    border:1px solid var(--border-soft);
    margin-bottom:16px;
  }
  .side-search input{
    background:none; border:none; outline:none; width:100%;
    font-size:12.5px; color:var(--text);
  }
  .side-search input::placeholder{color:var(--text-faint);}
  .side-search svg{color:var(--text-faint); flex-shrink:0;}

  .side-section{margin-bottom:6px;}
  .side-section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 8px;
    color:var(--text-faint);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.8px;
    text-transform:uppercase;
    font-family:var(--font-mono);
  }
  .side-section-head button{color:var(--text-faint); display:flex; align-items:center;}
  .side-section-head button:hover{color:var(--accent);}

  .project-item, .chat-item{
    display:flex; align-items:center; gap:9px;
    padding:7px 9px;
    border-radius:var(--radius-sm);
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer;
    transition:background .12s;
  }
  .project-item svg, .chat-item svg{flex-shrink:0; color:var(--text-faint);}
  .project-item:hover, .chat-item:hover{background:var(--bg-elev); color:var(--text);}
  .chat-item.active{background:var(--accent-soft); color:var(--accent);}
  .chat-item.active svg{color:var(--accent);}
  .chat-item{position:relative;}
  .chat-item .chat-item-label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chat-item .chat-remove{opacity:0; margin-left:auto; flex-shrink:0; padding:2px; border-radius:4px;}
  .chat-item:hover .chat-remove{opacity:1;}
  .chat-item .chat-remove:hover{color:var(--danger);}
  .project-item{position:relative;}
  .project-item.active{background:var(--accent-soft); color:var(--accent);}
  .project-item.active svg{color:var(--accent);}
  .project-item .proj-label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .project-item .proj-remove{opacity:0; margin-left:auto; flex-shrink:0; padding:2px; border-radius:4px;}
  .project-item:hover .proj-remove{opacity:1;}
  .project-item .proj-remove:hover{color:var(--danger);}
  .side-empty{padding:8px 9px; font-size:12px; color:var(--text-faint);}

  .side-scroll{flex:1; overflow-y:auto; padding-right:2px; margin-right:-2px;}

  .side-footer{
    border-top:1px solid var(--border-soft);
    padding-top:12px;
    margin-top:10px;
    display:flex; align-items:center; gap:10px;
  }
  .avatar{
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:12.5px; color:#1a1200;
    flex-shrink:0;
  }
  .side-footer-text{display:flex; flex-direction:column; line-height:1.25; overflow:hidden;}
  .side-footer-name{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .side-footer-plan{font-size:11px; color:var(--text-faint);}
  .side-footer-plan a{color:var(--accent); text-decoration:none;}
  .side-footer-gear{margin-left:auto; color:var(--text-faint); padding:4px;}
  .side-footer-gear:hover{color:var(--text);}

  /* ---------- Main ---------- */
  .main{
    position:relative;
    display:flex; flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  .topbar{
    display:flex; align-items:center; justify-content:center;
    padding:16px 20px;
    position:relative;
    flex-shrink:0;
    background:var(--topbar-bg);
    color:var(--topbar-fg);
    transition:background .2s ease, color .2s ease;
  }
  .menu-toggle{
    position:absolute; left:20px; top:50%; transform:translateY(-50%);
    display:none;
    color:var(--topbar-fg);
    padding:6px;
    border-radius:var(--radius-sm);
  }
  .menu-toggle:hover{background:rgba(128,128,128,0.15);}
  .plan-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--topbar-pill-bg);
    border:1px solid var(--border-soft);
    padding:6px 13px;
    border-radius:999px;
    font-size:12.5px;
    color:var(--topbar-fg-dim);
  }
  .plan-pill a{color:var(--accent); text-decoration:none; font-weight:600;}
  .plan-pill .dot{color:var(--topbar-fg-dim);}
  .topbar-icon{
    position:absolute; right:20px; top:50%; transform:translateY(-50%);
    color:var(--topbar-fg-dim);
    padding:6px;
  }
  .topbar-icon:hover{color:var(--topbar-fg);}

  .content{
    flex:1;
    display:flex; flex-direction:column; align-items:center;
    overflow-y:auto;
    padding:0 20px;
  }

  /* Composer dock — a fixed footer outside the scrollable content, so the
     composer always stays pinned to the bottom of the page (like Claude),
     never drifting to the middle regardless of hero/thread height. */
  .composer-dock{
    flex-shrink:0;
    width:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:0 20px 22px 20px;
    background:var(--bg);
  }

  /* Hero / greeting */
  .hero{
    width:100%; max-width:720px;
    margin-top:min(16vh, 150px);
    display:flex; flex-direction:column; align-items:center;
    flex-shrink:0;
    transition:opacity .2s ease;
  }
  .hero-bg{
    position:absolute; top:0; left:264px; right:0; height:420px;
    pointer-events:none;
    opacity:0.5;
    z-index:0;
    background:
      radial-gradient(ellipse 600px 300px at 50% 0%, rgba(255,178,56,0.06), transparent 70%);
  }
  .hero-mark{width:34px; height:34px; margin-bottom:14px;}
  .hero h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:34px;
    text-align:center;
    letter-spacing:-0.3px;
    color:var(--text);
  }
  .hero h1 span{color:var(--text-dim);}

  /* Composer */
  .composer-wrap{
    width:100%; max-width:720px;
    margin-top:14px;
    flex-shrink:0;
  }
  .attach-chips{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:8px;
  }
  .attach-chip{
    display:flex; align-items:center; gap:7px;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:6px 9px 6px 7px;
    font-size:12px;
  }
  .chip-badge{
    font-family:var(--font-mono); font-size:9px; font-weight:700;
    padding:3px 5px; border-radius:4px; color:#0B0D10;
    letter-spacing:0.3px;
  }
  .attach-chip .fname{max-width:130px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-dim);}
  .attach-chip .rm{color:var(--text-faint); display:flex; padding:2px;}
  .attach-chip .rm:hover{color:var(--danger);}

  .composer{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:14px 16px 10px 16px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
    transition:border-color .15s;
  }
  .composer:focus-within{border-color:#3A3F46;}
  .composer textarea{
    width:100%;
    background:none; border:none; outline:none; resize:none;
    font-size:15px; color:var(--text);
    line-height:1.5;
    max-height:200px;
    min-height:24px;
    font-family:var(--font-body);
  }
  .composer textarea::placeholder{color:var(--text-faint);}

  .composer-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px;
    gap:10px;
  }
  .composer-left{display:flex; align-items:center; gap:8px; position:relative;}
  .composer-right{display:flex; align-items:center; gap:8px; flex-shrink:0; position:relative;}

  .icon-btn{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    color:var(--text-dim);
    border:1px solid transparent;
    transition:background .15s, color .15s;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--bg-elev-2); color:var(--text);}
  .icon-btn.plus{border:1px solid var(--border); font-size:18px;}
  .icon-btn.active{background:var(--accent-soft); color:var(--accent);}
  .icon-btn.recording{background:var(--accent-soft); color:var(--danger); animation:mic-pulse 1.2s infinite;}
  @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,0.35);} 50%{box-shadow:0 0 0 6px rgba(255,107,107,0);}}

  .send-btn{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-elev-3);
    color:var(--text-faint);
    transition:background .15s, color .15s, transform .1s;
    flex-shrink:0;
  }
  .send-btn.ready{background:var(--accent); color:#241800;}
  .send-btn.ready:hover{transform:scale(1.05);}
  .send-btn:active{transform:scale(0.94);}

  /* Agent selector — min-width:0 + flex-shrink:1 lets this pill shrink
     and truncate instead of forcing the row to overflow, which is what
     was pushing the search/mic/send icons off-screen (or fully out of
     view) whenever a model's display name was long, especially on
     narrow phones. */
  .agent-btn{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px 6px 8px;
    border-radius:999px;
    border:1px solid var(--border);
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    background:var(--bg-elev-2);
    flex-shrink:1;
    min-width:0;
    max-width:180px;
  }
  .agent-btn:hover{border-color:#3A3F46;}
  .agent-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .agent-btn .chev{color:var(--text-faint); margin-left:1px; flex-shrink:0;}
  #agentBtnLabel{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
  }

  /* Thinking meter */
  .think-meter{
    display:flex; align-items:center; gap:5px;
    padding:6px 9px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--bg-elev-2);
    cursor:pointer;
    user-select:none;
    flex-shrink:0;
  }
  .think-label{font-size:11.5px; color:var(--text-dim); font-weight:600; margin-right:2px; font-family:var(--font-mono);}
  .think-bars{display:flex; align-items:flex-end; gap:2.5px; height:13px;}
  .think-bar{width:3.5px; border-radius:1px; background:var(--bg-elev-3); transition:background .15s;}
  .think-bar:nth-child(1){height:5px;}
  .think-bar:nth-child(2){height:7px;}
  .think-bar:nth-child(3){height:9px;}
  .think-bar:nth-child(4){height:11px;}
  .think-bar:nth-child(5){height:13px;}
  .think-bar.on{background:var(--accent);}

  /* Dropdown panels */
  .panel{
    position:absolute;
    bottom:calc(100% + 10px);
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:0 20px 45px -15px rgba(0,0,0,0.65);
    padding:6px;
    display:none;
    z-index:40;
  }
  .panel.open{display:block;}
  .panel.left{left:0;}
  .panel.right{right:0;}

  .attach-panel{width:220px;}
  .attach-opt{
    display:flex; align-items:center; gap:10px;
    padding:8px 9px; border-radius:var(--radius-sm);
    font-size:13px; width:100%; text-align:left;
  }
  .attach-opt:hover{background:var(--bg-elev-3);}
  .attach-opt .chip-badge{width:34px; text-align:center;}

  .agent-panel{
    width:320px; padding:8px 4px 8px 8px;
    max-height:min(420px, calc(100vh - 120px));
    overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:var(--text-faint) transparent;
  }
  .agent-panel::-webkit-scrollbar{width:6px;}
  .agent-panel::-webkit-scrollbar-thumb{background:var(--text-faint); border-radius:6px;}
  .agent-opt{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 9px; border-radius:var(--radius-sm);
    width:100%; text-align:left;
  }
  .agent-opt:hover{background:var(--bg-elev-3);}
  .agent-opt.selected{background:var(--accent-soft);}
  .agent-opt .agent-dot{margin-top:5px;}
  .agent-opt-name{font-size:13.5px; font-weight:600; font-family:var(--font-display);}
  .agent-opt-desc{font-size:11.5px; color:var(--text-faint); margin-top:2px; line-height:1.4;}
  .agent-opt-tag{
    font-family:var(--font-mono); font-size:9px; color:var(--text-faint);
    border:1px solid var(--border); border-radius:4px; padding:1px 5px; margin-left:auto;
    flex-shrink:0; margin-top:2px;
  }

  .think-panel{width:230px; padding:10px;}
  .think-opt{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 9px; border-radius:var(--radius-sm);
    font-size:13px; width:100%;
  }
  .think-opt:hover{background:var(--bg-elev-3);}
  .think-opt.selected{color:var(--accent); font-weight:600;}
  .think-opt-bars{display:flex; align-items:flex-end; gap:2.5px; height:13px;}

  /* Suggestion chips */
  .suggestions{
    display:flex; flex-wrap:wrap; justify-content:center; gap:9px;
    margin-top:16px; margin-bottom:30px; max-width:720px;
  }
  .sugg-chip{
    display:flex; align-items:center; gap:7px;
    padding:8px 14px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:13px;
    color:var(--text-dim);
    background:var(--bg-elev);
    transition:background .15s, border-color .15s;
  }
  .sugg-chip:hover{background:var(--bg-elev-2); border-color:#3A3F46; color:var(--text);}

  /* Chat thread */
  .thread{
    width:100%; max-width:720px;
    padding:26px 0 20px 0;
    display:none;
    flex-direction:column;
    gap:22px;
  }
  .msg{display:flex; gap:12px; max-width:100%;}
  .msg.user{justify-content:flex-end;}
  .msg-bubble{
    padding:11px 15px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.6;
    max-width:78%;
    overflow-wrap:break-word;
  }
  .msg.user .msg-bubble{background:var(--bg-elev-2); border:1px solid var(--border); border-bottom-right-radius:4px;}
  .msg.assistant{align-items:flex-start;}
  .msg-avatar{
    width:26px; height:26px; border-radius:8px; flex-shrink:0; margin-top:2px;
    background:var(--bg-elev-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  /* Assistant replies use the full width of the thread column (same width
     as the composer below) instead of a narrow 78% bubble — long answers
     shouldn't wrap into a tall, cramped box. */
  .msg.assistant .msg-body{max-width:100%; width:100%;}
  .msg.assistant .msg-bubble{max-width:100%; width:100%;}
  .msg-meta{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--text-faint); margin-bottom:5px;
    font-family:var(--font-mono);
  }
  .msg-meta .agent-dot{width:6px; height:6px;}
  .msg.assistant .msg-bubble{background:var(--bg-elev); border:1px solid var(--border-soft); border-bottom-left-radius:4px; color:var(--text);}

  /* Rendered markdown inside assistant replies */
  .msg-bubble p{margin:0 0 10px 0;}
  .msg-bubble p:last-child{margin-bottom:0;}
  .msg-bubble h1,.msg-bubble h2,.msg-bubble h3,.msg-bubble h4{
    font-family:var(--font-display); font-weight:600; color:var(--text);
    margin:16px 0 8px 0; line-height:1.3;
  }
  .msg-bubble h1:first-child,.msg-bubble h2:first-child,.msg-bubble h3:first-child,.msg-bubble h4:first-child{margin-top:0;}
  .msg-bubble h1{font-size:20px;}
  .msg-bubble h2{font-size:17.5px;}
  .msg-bubble h3{font-size:15.5px;}
  .msg-bubble h4{font-size:14.5px;}
  .msg-bubble ul,.msg-bubble ol{margin:0 0 10px 0; padding-left:22px;}
  .msg-bubble li{margin-bottom:4px;}
  .msg-bubble li:last-child{margin-bottom:0;}
  .msg-bubble li>p{margin-bottom:4px;}
  .msg-bubble strong{font-weight:700; color:var(--text);}
  .msg-bubble em{font-style:italic;}
  .msg-bubble a{color:var(--accent-2); text-decoration:underline; text-decoration-color:var(--accent-soft); word-break:break-word;}
  .msg-bubble a:hover{color:var(--accent);}
  .msg-bubble code{
    font-family:var(--font-mono); font-size:12.5px;
    background:var(--bg-elev-3); border:1px solid var(--border);
    padding:1.5px 5px; border-radius:5px;
  }
  .msg-bubble pre{
    background:var(--bg-elev-3); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; margin:0 0 10px 0;
    overflow-x:auto;
  }
  .msg-bubble pre code{background:none; border:none; padding:0; font-size:12.5px; line-height:1.5;}
  .msg-bubble blockquote{
    margin:0 0 10px 0; padding:2px 14px;
    border-left:3px solid var(--accent-2);
    color:var(--text-dim);
  }
  .msg-bubble hr{border:none; border-top:1px solid var(--border); margin:14px 0;}
  .msg-bubble table{border-collapse:collapse; margin:0 0 10px 0; font-size:13px; width:100%;}
  .msg-bubble th,.msg-bubble td{border:1px solid var(--border); padding:6px 10px; text-align:left;}
  .msg-bubble th{background:var(--bg-elev-2); font-weight:600;}
  .msg-bubble .stream-cursor{
    display:inline-block; width:7px; height:15px; margin-left:1px;
    background:var(--accent); vertical-align:text-bottom;
    animation:cursor-blink 0.85s infinite;
  }
  @keyframes cursor-blink{0%,50%{opacity:1;} 51%,100%{opacity:0;}}

  .typing{display:flex; gap:4px; padding:4px 2px;}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--text-faint); animation:bounce 1.1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:0.5;} 30%{transform:translateY(-4px); opacity:1;}}

  /* Per-message action row — copy / edit / retry, Claude-style. */
  .msg-actions{
    display:flex; align-items:center; gap:2px;
    margin-top:6px;
  }
  .msg.user .msg-actions{justify-content:flex-end;}
  .msg-action-btn{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
    color:var(--text-faint);
    transition:background .15s, color .15s;
  }
  .msg-action-btn:hover{background:var(--bg-elev-2); color:var(--text-dim);}
  .msg-action-btn.copied{color:var(--teal);}
  .msg-action-btn svg{display:block;}

  /* Inline edit box for a user message */
  .msg-edit-box{width:100%;}
  .msg-edit-box textarea{
    width:100%; min-height:60px; resize:vertical;
    background:var(--bg-elev); border:1px solid var(--border);
    border-radius:12px; padding:10px 13px; color:var(--text);
    font-family:var(--font-body); font-size:14.5px; line-height:1.5; outline:none;
  }
  .msg-edit-box textarea:focus{border-color:#3A3F46;}
  .msg-edit-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:8px;}
  .msg-edit-actions .btn{padding:7px 14px; font-size:13px;}

  /* Sources — shown under an assistant reply when web search was used,
     styled like reference cards rather than raw links. */
  .msg-sources{
    margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border-soft);
  }
  .msg-sources-label{
    font-size:11px; font-family:var(--font-mono); color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.4px; margin-bottom:7px;
  }
  .msg-sources-list{display:flex; flex-direction:column; gap:6px;}
  .msg-source-link{
    display:flex; align-items:center; gap:8px;
    padding:7px 10px;
    background:var(--bg-elev-2); border:1px solid var(--border-soft);
    border-radius:10px; text-decoration:none;
  }
  .msg-source-link:hover{border-color:#3A3F46; background:var(--bg-elev-3);}
  .msg-source-num{
    flex-shrink:0; width:16px; height:16px; border-radius:50%;
    background:var(--bg-elev-3); color:var(--text-faint);
    font-size:9.5px; font-weight:700; font-family:var(--font-mono);
    display:flex; align-items:center; justify-content:center;
  }
  .msg-source-text{min-width:0; overflow:hidden;}
  .msg-source-title{
    display:block;
    font-size:12.5px; font-weight:600; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .msg-source-domain{
    display:block;
    font-size:11px; color:var(--text-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* Settings modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:none; align-items:center; justify-content:center; z-index:100;
    backdrop-filter:blur(2px);
  }
  .modal-overlay.open{display:flex;}
  .modal{
    width:400px; background:var(--bg-elev); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:22px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.7);
  }
  .modal h3{font-family:var(--font-display); font-size:17px; margin-bottom:4px;}
  .modal p.sub{font-size:12.5px; color:var(--text-faint); margin-bottom:18px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{font-size:11.5px; color:var(--text-dim); font-weight:600; display:block; margin-bottom:6px; font-family:var(--font-mono); letter-spacing:0.3px;}
  .field input{
    width:100%; padding:9px 11px; background:var(--bg-elev-2);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    font-size:13px; outline:none;
  }
  .field input:focus{border-color:var(--accent-2);}
  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .theme-opt{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
    font-size:12.5px; color:var(--text-dim); background:var(--bg-elev-2);
  }
  .theme-opt:hover{border-color:var(--accent-2); color:var(--text);}
  .theme-opt.selected{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .theme-swatch{
    width:16px; height:16px; border-radius:50%; flex-shrink:0;
    border:1px solid rgba(128,128,128,0.3);
  }
  .theme-swatch.dark{background:linear-gradient(135deg,#0B0D10 50%,#FFB238 50%);}
  .theme-swatch.claude{background:linear-gradient(135deg,#F5F1EA 50%,#C15F3C 50%);}
  .theme-swatch.browser{background:linear-gradient(135deg,#FFFFFF 50%,#1A73E8 50%);}
  .theme-swatch.system{background:conic-gradient(#0B0D10 0 50%, #FFFFFF 50% 100%);}
  .theme-swatch.classic-blue{background:linear-gradient(180deg,#0B2447 40%,#FFFFFF 40%);}
  .lang-opt.selected{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .btn{padding:8px 16px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;}
  .btn.ghost{color:var(--text-dim);}
  .btn.ghost:hover{background:var(--bg-elev-2);}
  .btn.primary{background:var(--accent); color:#241800;}
  .btn.primary:hover{filter:brightness(1.06);}

  /* Model library modal */
  .modal.wide{width:520px; max-width:92vw;}
  .lib-search{
    display:flex; align-items:center; gap:8px;
    padding:9px 12px; margin-bottom:12px;
    background:var(--bg-elev-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  }
  .lib-search svg{color:var(--text-faint); flex-shrink:0;}
  .lib-search input{background:none; border:none; outline:none; width:100%; font-size:13px;}
  .lib-search input::placeholder{color:var(--text-faint);}
  .lib-list{max-height:380px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;}
  .lib-status{padding:24px 8px; text-align:center; color:var(--text-faint); font-size:12.5px;}
  .lib-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 8px; border-radius:var(--radius-sm);
  }
  .lib-row:hover{background:var(--bg-elev-2);}
  .lib-row-main{flex:1; min-width:0;}
  .lib-row-name{font-size:13px; font-weight:600; font-family:var(--font-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lib-row-id{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lib-row-meta{font-size:10.5px; color:var(--text-faint); margin-top:1px; font-family:var(--font-mono);}
  .lib-row-meta.free{color:var(--teal);}
  .lib-add-btn{
    flex-shrink:0; font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:999px; border:1px solid var(--border);
    color:var(--text-dim);
  }
  .lib-add-btn:hover{border-color:var(--accent); color:var(--accent);}
  .lib-add-btn.added{color:var(--teal); border-color:var(--teal); cursor:default;}
  .agent-panel-footer{
    border-top:1px solid var(--border); margin-top:4px; padding-top:4px;
  }
  .agent-remove{
    flex-shrink:0; color:var(--text-faint); padding:4px; border-radius:6px; align-self:center;
  }
  .agent-remove:hover{color:var(--danger); background:var(--bg-elev-3);}
  .add-agent-row{
    display:flex; align-items:center; gap:10px; width:100%;
    padding:9px; border-radius:var(--radius-sm); color:var(--accent); font-size:13px; font-weight:600;
  }
  .add-agent-row:hover{background:var(--bg-elev-3);}

  /* Mobile */
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed; left:0; top:0; bottom:0; width:264px; z-index:60;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:0 0 40px rgba(0,0,0,0.5);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-toggle{display:flex;}
    .hero-bg{left:0;}
    .hero h1{font-size:26px;}
    /* Give the user's own bubble more breathing room on narrow screens —
       78% of an already-narrow phone width wraps text too aggressively. */
    .msg.user .msg-bubble{max-width:88%;}
    .msg-bubble{font-size:14px; padding:10px 13px;}
    .content{padding:0 14px;}
    .composer-dock{padding:0 14px 16px 14px;}
    /* Tighten the composer control row so it lays out the same way on
       every phone instead of varying by name length / screen width. */
    .composer-row{gap:6px;}
    .composer-right{gap:5px;}
    .agent-btn{max-width:104px; padding:6px 8px 6px 7px; font-size:12px;}
    .think-meter{padding:5px 7px;}
    .icon-btn, .send-btn{width:30px; height:30px;}
  }
  @media (max-width:380px){
    .agent-btn{max-width:78px;}
    .think-label{display:none;}
    .think-meter{padding:6px;}
  }
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:55; display:none;
  }
  .scrim.open{display:block;}
</style>
</head>
<body>

<!-- ============ ACCESS LOCK SCREEN ============ -->
<div id="lockScreen" style="position:fixed; inset:0; background:#0B0D10; z-index:200; display:flex; align-items:center; justify-content:center;">
  <div style="width:340px; max-width:88vw; text-align:center;">
    <svg width="34" height="34" viewBox="0 0 32 32" fill="none" style="margin-bottom:16px;">
      <path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" stroke="#FFB238" stroke-width="1.6" fill="rgba(255,178,56,0.08)"/>
      <circle cx="16" cy="16" r="2.4" fill="#FFB238"/>
      <circle cx="16" cy="9" r="1.6" fill="#FFB238" opacity="0.7"/>
      <circle cx="22" cy="19.5" r="1.6" fill="#FFB238" opacity="0.7"/>
      <circle cx="10" cy="19.5" r="1.6" fill="#FFB238" opacity="0.7"/>
      <line x1="16" y1="16" x2="16" y2="9" stroke="#FFB238" stroke-width="1" opacity="0.5"/>
      <line x1="16" y1="16" x2="22" y2="19.5" stroke="#FFB238" stroke-width="1" opacity="0.5"/>
      <line x1="16" y1="16" x2="10" y2="19.5" stroke="#FFB238" stroke-width="1" opacity="0.5"/>
    </svg>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; color:#ECEEF0; margin-bottom:6px;">FreeAI</div>
    <div style="font-size:13px; color:#9AA0A8; margin-bottom:18px;">Enter the access code to continue.</div>
    <input type="password" id="lockInput" placeholder="Access code" style="width:100%; padding:11px 13px; background:#15181C; border:1px solid #262B31; border-radius:10px; color:#ECEEF0; font-size:14px; outline:none; text-align:center;" onkeydown="if(event.key==='Enter') submitLockCode()">
    <button onclick="submitLockCode()" style="width:100%; margin-top:10px; padding:11px; background:#FFB238; color:#241800; border:none; border-radius:10px; font-weight:600; font-size:13.5px; cursor:pointer;">Continue</button>
    <div id="lockError" style="color:#FF6B6B; font-size:12px; margin-top:10px; min-height:14px;"></div>
  </div>
</div>

<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" stroke="#FFB238" stroke-width="1.6" fill="rgba(255,178,56,0.08)"/>
        <circle cx="16" cy="16" r="2.4" fill="#FFB238"/>
        <circle cx="16" cy="9" r="1.6" fill="#FFB238" opacity="0.7"/>
        <circle cx="22" cy="19.5" r="1.6" fill="#FFB238" opacity="0.7"/>
        <circle cx="10" cy="19.5" r="1.6" fill="#FFB238" opacity="0.7"/>
        <line x1="16" y1="16" x2="16" y2="9" stroke="#FFB238" stroke-width="1" opacity="0.5"/>
        <line x1="16" y1="16" x2="22" y2="19.5" stroke="#FFB238" stroke-width="1" opacity="0.5"/>
        <line x1="16" y1="16" x2="10" y2="19.5" stroke="#FFB238" stroke-width="1" opacity="0.5"/>
      </svg>
      <div class="brand-text">
        <div class="brand-name">FreeAI</div>
        <div class="brand-sub">by Sarath Sreekumar</div>
      </div>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" onclick="toggleSidebarCollapse()" title="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" onclick="newChat()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>

    <div class="side-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="chatSearchInput" placeholder="Search chats" oninput="renderChatList()">
    </div>

    <div class="side-scroll">
      <div class="side-section">
        <div class="side-section-head">
          <span>Projects</span>
          <button title="New project" onclick="createProject()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="projectList"></div>
      </div>

      <div id="chatListRoot"></div>
    </div>

    <div class="side-footer">
      <div class="avatar">SS</div>
      <div class="side-footer-text">
        <div class="side-footer-plan">Free plan</div>
      </div>
      <button class="side-footer-gear" title="Settings" onclick="openSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.04z"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

  <button class="sidebar-restore-btn" id="sidebarRestoreBtn" onclick="toggleSidebarCollapse()" title="Show sidebar" style="display:none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
  </button>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar(true)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="plan-pill">Free plan</div>
      <button class="topbar-icon" title="Settings" onclick="openSettings()">

<script>
/* =========================================================
   FreeAI — front-end shell
   Wire your API in callModel() below.
   ========================================================= */

// Starting lineup — all real OpenRouter slugs. Add/remove any time from the
// model library (agent selector → "Add from OpenRouter").
const DEFAULT_AGENTS = [
  { id:'nvidia/nemotron-3-ultra-550b-a55b:free', name:'Nemotron 3 Ultra', color:'#4FD1C5', tag:'FLAGSHIP', desc:'NVIDIA · 55B active / 550B total MoE — frontier reasoning and long-horizon agent orchestration.' },
  { id:'nvidia/nemotron-3-super-120b-a12b:free', name:'Nemotron 3 Super', color:'#FFB238', tag:'BALANCED', desc:'NVIDIA · 120B hybrid MoE, 12B active — fast, efficient, strong all-around performance.' },
  { id:'openai/gpt-oss-120b:free', name:'GPT-OSS 120B', color:'#9B8CFF', tag:'OPEN 120B', desc:'OpenAI · 117B open-weight MoE — configurable reasoning depth, strong tool use.' },
];

const AGENT_COLORS = ['#4FD1C5','#FFB238','#9B8CFF','#FF7A9E','#7FD858','#5B9DFF','#FF9E5B','#E88CFF'];
let colorCursor = DEFAULT_AGENTS.length;

const THINK_LEVELS = ['Low','Medium','High','Extra','Max'];

// Claude-style line icons used in the per-message action row.
const ICON_COPY = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const ICON_EDIT = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const ICON_RETRY = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`;
const ICON_CHECK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

let state = {
  agents: DEFAULT_AGENTS.slice(),
  agent: DEFAULT_AGENTS[1],
  thinkIndex: 1, // Medium
  attachments: [],
  messages: [],
  // Defaults to ON so every message gets web-grounded answers without
  // having to flip the toggle each time. Once the user changes it, their
  // choice is remembered (localStorage) instead of resetting on reload.
  webSearchOn: localStorage.getItem('freeai_websearch') !== '0',
  libraryModels: null, // cached fetch from OpenRouter
  theme: localStorage.getItem('freeai_theme') || 'dark',
  language: localStorage.getItem('freeai_language') || 'auto',
  chats: [],            // persisted chat history, loaded below
  currentChatId: null,
  projects: [],         // persisted projects, loaded below
  activeProjectId: null,
};

/* ---------- persistence: chat history & projects (localStorage) ---------- */
function loadPersisted(){
  try{
    state.chats = JSON.parse(localStorage.getItem('freeai_chats') || '[]');
  }catch(e){ state.chats = []; }
  try{
    state.projects = JSON.parse(localStorage.getItem('freeai_projects') || '[]');
  }catch(e){ state.projects = []; }
}
function saveChats(){
  // Attachments carry a raw File object which cannot be persisted —
  // strip it and keep only display metadata (type/name).
  const safe = state.chats.map(c => ({
    ...c,
    messages: c.messages.map(m => ({
      role:m.role, text:m.text,
      attachments:(m.attachments||[]).map(a=>({type:a.type, name:a.name}))
    }))
  }));
  localStorage.setItem('freeai_chats', JSON.stringify(safe));
}
function saveProjects(){
  localStorage.setItem('freeai_projects', JSON.stringify(state.projects));
}

/* ---------- theme ---------- */
function applyTheme(name){
  let effective = name;
  if(name === 'system'){
    effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'browser';
  }
  document.documentElement.setAttribute('data-theme', effective);
  document.querySelectorAll('.theme-opt[id^="theme-opt-"]').forEach(el=>{
    el.classList.toggle('selected', el.id === 'theme-opt-'+name);
  });
}
function setTheme(name){
  state.theme = name;
  localStorage.setItem('freeai_theme', name);
  applyTheme(name);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if(state.theme === 'system') applyTheme('system');
});

/* ---------- response language ---------- */
function setLanguage(lang){
  state.language = lang;
  localStorage.setItem('freeai_language', lang);
  document.querySelectorAll('.lang-opt[id^="lang-opt-"]').forEach(el=>{
    el.classList.toggle('selected', el.id === 'lang-opt-'+lang);
  });
}
function applyLanguageUI(){
  document.querySelectorAll('.lang-opt[id^="lang-opt-"]').forEach(el=>{
    el.classList.toggle('selected', el.id === 'lang-opt-'+state.language);
  });
}

/* ---------- render pickers ---------- */
function renderAgentPanel(){
  const panel = document.getElementById('agentPanel');
  panel.innerHTML = state.agents.map(a => `
    <div style="display:flex; align-items:center;">
      <button class="agent-opt ${a.id===state.agent.id?'selected':''}" onclick="selectAgent('${escAttr(a.id)}')" style="flex:1; min-width:0;">
        <span class="agent-dot" style="background:${a.color}"></span>
        <div style="min-width:0;">
          <div class="agent-opt-name">${a.name}</div>
          <div class="agent-opt-desc">${a.desc}</div>
        </div>
        ${a.tag ? `<span class="agent-opt-tag">${a.tag}</span>` : ''}
      </button>
      ${state.agents.length>1 ? `<button class="agent-remove" title="Remove" onclick="removeAgent('${escAttr(a.id)}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>` : ''}
    </div>
  `).join('') + `
    <div class="agent-panel-footer">
      <button class="add-agent-row" onclick="openLibrary()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add from OpenRouter
      </button>
    </div>`;
}

function escAttr(s){ return String(s).replace(/'/g, "\\'"); }

function removeAgent(id){
  if(state.agents.length<=1) return;
  state.agents = state.agents.filter(a=>a.id!==id);
  if(state.agent.id===id) state.agent = state.agents[0];
  updateComposerButtons();
}

function renderThinkPanel(){
  const panel = document.getElementById('thinkPanel');
  panel.innerHTML = THINK_LEVELS.map((lvl, i) => `
    <button class="think-opt ${i===state.thinkIndex?'selected':''}" onclick="selectThink(${i})">
      <span>${lvl}</span>
      <span class="think-opt-bars">${barsHtml(i)}</span>
    </button>
  `).join('');
}

function barsHtml(activeIndex){
  let html = '';
  for(let i=0;i<5;i++){
    html += `<span class="think-bar ${i<=activeIndex?'on':''}" style="height:${5+i*2}px"></span>`;
  }
  return html;
}

function updateComposerButtons(){
  document.getElementById('agentDotBtn').style.background = state.agent.color;
  document.getElementById('agentBtnLabel').textContent = state.agent.name;
  document.getElementById('thinkLabel').textContent = THINK_LEVELS[state.thinkIndex];
  document.getElementById('thinkBarsBtn').innerHTML = barsHtml(state.thinkIndex);
  renderAgentPanel();
  renderThinkPanel();
}

function selectAgent(id){
  state.agent = state.agents.find(a=>a.id===id);
  updateComposerButtons();
  closeAllPanels();
}
function selectThink(i){
  state.thinkIndex = i;
  updateComposerButtons();
  closeAllPanels();
}
function toggleWebSearch(){
  state.webSearchOn = !state.webSearchOn;
  localStorage.setItem('freeai_websearch', state.webSearchOn ? '1' : '0');
  applyWebSearchUI();
}
function applyWebSearchUI(){
  const btn = document.getElementById('webSearchBtn');
  btn.classList.toggle('active', state.webSearchOn);
  btn.title = state.webSearchOn ? 'Web search is ON for your next message' : 'Search the web before answering';
}

/* ---------- voice input (Web Speech API) ---------- */
let micRecognition = null;
let micRecording = false;
function toggleMic(){
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if(!SpeechRecognitionCtor){
    alert('Voice input needs browser speech recognition support (Chrome or Edge work best). This browser doesn\'t expose it.');
    return;
  }
  if(micRecording){
    micRecognition.stop();
    return;
  }

  const input = document.getElementById('composerInput');
  const baseText = input.value.trim() ? input.value.trim() + ' ' : '';

  micRecognition = new SpeechRecognitionCtor();
  micRecognition.lang = state.language === 'ml' ? 'ml-IN' : (state.language === 'en' ? 'en-US' : (navigator.language || 'en-US'));
  micRecognition.interimResults = true;
  micRecognition.continuous = true;

  micRecognition.onstart = ()=>{
    micRecording = true;
    micBtn.classList.add('recording');
    micBtn.title = 'Listening… click to stop';
  };
  micRecognition.onresult = (e)=>{
    let transcript = '';
    for(let i=0;i<e.results.length;i++){
      transcript += e.results[i][0].transcript;
    }
    input.value = baseText + transcript;
    autoResize(input);
  };
  micRecognition.onerror = (e)=>{
    if(e.error !== 'no-speech' && e.error !== 'aborted'){
      alert('Voice input error: ' + e.error + (e.error==='not-allowed' ? ' — check microphone permission for this site.' : ''));
    }
  };
  micRecognition.onend = ()=>{
    micRecording = false;
    micBtn.classList.remove('recording');
    micBtn.title = 'Voice input';
  };
  micRecognition.start();
}

/* ---------- panels ---------- */
function togglePanel(id){
  const panel = document.getElementById(id);
  const isOpen = panel.classList.contains('open');
  closeAllPanels();
  if(!isOpen) panel.classList.add('open');
}
function closeAllPanels(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.composer-left') && !e.target.closest('.composer-right')){
    closeAllPanels();
  }
});

/* ---------- attachments ---------- */
const FILE_META = {
  xlsx:{label:'XLS', color:'#3FBF7F', accept:'.xlsx,.xls,.csv'},
  docx:{label:'DOC', color:'#5B9DFF', accept:'.docx,.doc'},
  pdf:{label:'PDF', color:'#FF6B6B', accept:'.pdf'},
  md:{label:'MD', color:'#9B8CFF', accept:'.md'},
  txt:{label:'TXT', color:'#8B929A', accept:'.txt'},
  img:{label:'IMG', color:'#FFB238', accept:'.png,.jpg,.jpeg,.gif,.webp'},
};

function pickFile(type){
  closeAllPanels();
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = FILE_META[type].accept;
  input.multiple = true;
  input.onchange = (e)=>{
    Array.from(e.target.files).forEach(f=>{
      state.attachments.push({type, name:f.name, file:f});
    });
    renderAttachChips();
  };
  input.click();
}

function renderAttachChips(){
  const wrap = document.getElementById('attachChips');
  wrap.innerHTML = state.attachments.map((a,i)=>{
    const meta = FILE_META[a.type];
    return `<div class="attach-chip">
      <span class="chip-badge" style="background:${meta.color}">${meta.label}</span>
      <span class="fname">${a.name}</span>
      <button class="rm" onclick="removeAttachment(${i})">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join('');
}
function removeAttachment(i){
  state.attachments.splice(i,1);
  renderAttachChips();
}

/* ---------- composer ---------- */
function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  document.getElementById('sendBtn').classList.toggle('ready', el.value.trim().length>0 || state.attachments.length>0);
}
function handleKeydown(e){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}
function fillPrompt(kind){
  const map = {
    Write:'Help me write ',
    Learn:'Explain to me how ',
    Code:'Help me build ',
    Analyze:'Analyze this data and tell me ',
    Automate:'Help me automate ',
  };
  const input = document.getElementById('composerInput');
  input.value = map[kind] || '';
  input.focus();
  autoResize(input);
}

/* ---------- sidebar / chat lifecycle ---------- */
function newChat(){
  state.messages = [];
  state.currentChatId = null;
  state.attachments = [];
  renderAttachChips();
  document.getElementById('composerInput').value='';
  document.getElementById('thread').style.display='none';
  document.getElementById('thread').innerHTML='';
  document.getElementById('hero').style.display='flex';
  document.getElementById('suggestions').style.display='flex';
  toggleSidebar(false);
  renderChatList();
}
function toggleSidebar(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('scrim').classList.toggle('open', open);
}

/* ---------- desktop sidebar collapse / restore ---------- */
function toggleSidebarCollapse(forceState){
  const app = document.getElementById('app');
  const collapsed = typeof forceState === 'boolean'
    ? forceState
    : !app.classList.contains('sidebar-collapsed');
  app.classList.toggle('sidebar-collapsed', collapsed);
  document.getElementById('sidebarRestoreBtn').style.display = collapsed ? 'flex' : 'none';
  localStorage.setItem('freeai_sidebar_collapsed', collapsed ? '1' : '0');
}

/* ---------- projects (sidebar) ---------- */
function createProject(){
  const name = prompt('Name your project:');
  if(!name || !name.trim()) return;
  const proj = { id:'p_'+Date.now(), name:name.trim() };
  state.projects.push(proj);
  state.activeProjectId = proj.id;
  saveProjects();
  renderProjects();
}
function selectProject(id){
  state.activeProjectId = (state.activeProjectId === id) ? null : id;
  renderProjects();
}
function removeProject(id, ev){
  ev.stopPropagation();
  state.projects = state.projects.filter(p=>p.id!==id);
  if(state.activeProjectId === id) state.activeProjectId = null;
  saveProjects();
  renderProjects();
}
function renderProjects(){
  const el = document.getElementById('projectList');
  if(!state.projects.length){
    el.innerHTML = `<div class="side-empty">No projects yet — tap + to create one.</div>`;
    return;
  }
  el.innerHTML = state.projects.map(p => `
    <div class="project-item ${p.id===state.activeProjectId?'active':''}" onclick="selectProject('${p.id}')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      <span class="proj-label">${escapeHtml(p.name)}</span>
      <button class="proj-remove" title="Delete project" onclick="removeProject('${p.id}', event)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`).join('');
}

/* ---------- persisted chat history (sidebar) ---------- */
function chatIcon(){
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
}
function renderChatList(){
  const root = document.getElementById('chatListRoot');
  const q = (document.getElementById('chatSearchInput')?.value || '').trim().toLowerCase();
  let chats = state.chats.slice().sort((a,b)=> b.updatedAt - a.updatedAt);
  if(q) chats = chats.filter(c => c.title.toLowerCase().includes(q));

  if(!chats.length){
    root.innerHTML = `<div class="side-section"><div class="side-empty">${q ? 'No chats match your search.' : 'No saved chats yet — start typing below.'}</div></div>`;
    return;
  }

  const now = Date.now();
  const oneDay = 86400000;
  const groups = { Today:[], 'Previous 7 days':[], Older:[] };
  chats.forEach(c=>{
    const age = now - c.updatedAt;
    if(age < oneDay) groups['Today'].push(c);
    else if(age < oneDay*7) groups['Previous 7 days'].push(c);
    else groups['Older'].push(c);
  });

  root.innerHTML = Object.entries(groups).filter(([,list])=>list.length).map(([label, list]) => `
    <div class="side-section">
      <div class="side-section-head"><span>${label}</span></div>
      ${list.map(c => `
        <div class="chat-item ${c.id===state.currentChatId?'active':''}" onclick="openChat('${c.id}')">
          ${chatIcon()}
          <span class="chat-item-label">${escapeHtml(c.title)}</span>
          <button class="chat-remove" title="Delete chat" onclick="removeChat('${c.id}', event)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>`).join('')}
    </div>`).join('');
}
function openChat(id){
  const chat = state.chats.find(c=>c.id===id);
  if(!chat) return;
  state.currentChatId = id;
  state.messages = chat.messages.map(m=>({...m, attachments:m.attachments||[]}));
  state.attachments = [];
  renderAttachChips();
  document.getElementById('hero').style.display='none';
  document.getElementById('suggestions').style.display='none';
  const thread = document.getElementById('thread');
  thread.style.display='flex';
  thread.innerHTML='';
  state.messages.forEach((m, idx)=>{
    if(m.role==='user') appendUserBubble(m.text, m.attachments||[], idx);
    else appendAssistantBubble(m.text, idx, m.sources);
  });
  thread.scrollTop = thread.scrollHeight;
  toggleSidebar(false);
  renderChatList();
}
function removeChat(id, ev){
  ev.stopPropagation();
  state.chats = state.chats.filter(c=>c.id!==id);
  if(state.currentChatId === id) newChat();
  saveChats();
  renderChatList();
}
function persistCurrentChat(){
  if(!state.currentChatId){
    const firstUserMsg = state.messages.find(m=>m.role==='user');
    const title = (firstUserMsg?.text || 'New conversation').slice(0,60);
    const chat = { id:'c_'+Date.now(), title, messages:[], createdAt:Date.now(), updatedAt:Date.now(), projectId:state.activeProjectId };
    state.chats.push(chat);
    state.currentChatId = chat.id;
  }
  const chat = state.chats.find(c=>c.id===state.currentChatId);
  chat.messages = state.messages;
  chat.updatedAt = Date.now();
  saveChats();
  renderChatList();
}

/* ---------- send / render messages ---------- */
function sendMessage(){
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if(!text && state.attachments.length===0) return;
  const userAttachments = [...state.attachments];

  submitUserText(text, userAttachments);

  state.attachments = [];
  renderAttachChips();
  input.value='';
  autoResize(input);
}

// Shared by sendMessage() and saveEditMsg() — appends a user message and
// kicks off the assistant's reply. idx is implied by state.messages.length.
function submitUserText(text, attachments){
  if(!text && (!attachments || attachments.length===0)) return;

  document.getElementById('hero').style.display='none';
  document.getElementById('suggestions').style.display='none';
  const thread = document.getElementById('thread');
  thread.style.display='flex';

  state.messages.push({role:'user', text, attachments: attachments||[]});
  appendUserBubble(text, attachments||[], state.messages.length-1);
  persistCurrentChat();

  runAssistantTurn();
}

// Streams a fresh assistant reply for whatever's currently in
// state.messages — used both for a normal send and for "retry".
function runAssistantTurn(){
  const thinkingId = appendAssistantTyping();
  const content = document.getElementById('content');
  content.scrollTop = content.scrollHeight;

  streamModel(state.messages, state.agent, THINK_LEVELS[state.thinkIndex], state.webSearchOn, state.language,
    (textSoFar)=>{
      // Called as each chunk arrives — text appears progressively instead
      // of waiting for the full reply, which is what makes this feel fast.
      updateStreamingBubble(thinkingId, textSoFar, false);
      content.scrollTop = content.scrollHeight;
    })
    .then(({text, sources}) => {
      state.messages.push({role:'assistant', text, sources});
      updateStreamingBubble(thinkingId, text, true, sources, state.messages.length-1);
      content.scrollTop = content.scrollHeight;
      persistCurrentChat();
    });
}

function appendUserBubble(text, attachments, idx){
  const thread = document.getElementById('thread');
  const chipsHtml = attachments.length ? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; justify-content:flex-end;">${
    attachments.map(a=>`<span class="chip-badge" style="background:${FILE_META[a.type].color}; font-size:9px;">${FILE_META[a.type].label}</span>`).join('')
  }</div>` : '';
  const div = document.createElement('div');
  div.className='msg user';
  div.innerHTML = `<div class="msg-bubble">${chipsHtml}${escapeHtml(text)}</div>`;
  thread.appendChild(div);
  renderMsgActions(div, 'user', idx);
}

let typingCounter = 0;
function appendAssistantTyping(){
  const thread = document.getElementById('thread');
  const id = 'typing-'+(typingCounter++);
  const div = document.createElement('div');
  div.className='msg assistant';
  div.id = id;
  div.innerHTML = `
    <div class="msg-avatar">
      <span style="width:6px;height:6px;border-radius:50%;background:${state.agent.color};display:block;"></span>
    </div>
    <div class="msg-body">
      <div class="msg-meta"><span class="agent-dot" style="background:${state.agent.color}"></span>${state.agent.name} · ${THINK_LEVELS[state.thinkIndex]} thinking${state.webSearchOn ? ' · 🌐 searching the web' : ''}</div>
      <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>`;
  thread.appendChild(div);
  return id;
}
function updateStreamingBubble(id, textSoFar, done, sources, idx){
  const el = document.getElementById(id);
  if(!el) return;
  const bubble = el.querySelector('.msg-bubble');
  bubble.innerHTML = renderMarkdown(textSoFar) + (done ? '' : '<span class="stream-cursor"></span>');
  if(done){
    const body = el.querySelector('.msg-body');
    renderSourcesInto(body, sources);
    renderMsgActions(body, 'assistant', idx);
    el.removeAttribute('id'); // was only needed to target it while streaming
  }
}
function appendAssistantBubble(text, idx, sources){
  // Renders a saved assistant message instantly (no typing animation) —
  // used when re-opening a chat loaded from history.
  const thread = document.getElementById('thread');
  const div = document.createElement('div');
  div.className='msg assistant';
  div.innerHTML = `
    <div class="msg-avatar">
      <span style="width:6px;height:6px;border-radius:50%;background:${state.agent.color};display:block;"></span>
    </div>
    <div class="msg-body">
      <div class="msg-meta"><span class="agent-dot" style="background:${state.agent.color}"></span>${state.agent.name}</div>
      <div class="msg-bubble">${renderMarkdown(text)}</div>
    </div>`;
  thread.appendChild(div);
  const body = div.querySelector('.msg-body');
  renderSourcesInto(body, sources);
  renderMsgActions(body, 'assistant', idx);
}

/* ---------- per-message actions: copy / edit / retry ---------- */
function renderMsgActions(container, role, idx){
  if(!container || idx===undefined) return;
  const div = document.createElement('div');
  div.className = 'msg-actions';
  const copyBtn = `<button class="msg-action-btn" title="Copy" onclick="copyMsg(${idx}, this)">${ICON_COPY}</button>`;
  const secondBtn = role === 'user'
    ? `<button class="msg-action-btn" title="Edit" onclick="startEditMsg(${idx})">${ICON_EDIT}</button>`
    : `<button class="msg-action-btn" title="Retry" onclick="retryMsg(${idx})">${ICON_RETRY}</button>`;
  div.innerHTML = copyBtn + secondBtn;
  container.appendChild(div);
}

function copyMsg(idx, btnEl){
  const m = state.messages[idx];
  if(!m) return;
  const flash = ()=>{
    const original = btnEl.innerHTML;
    btnEl.innerHTML = ICON_CHECK;
    btnEl.classList.add('copied');
    setTimeout(()=>{ btnEl.innerHTML = original; btnEl.classList.remove('copied'); }, 1200);
  };
  const text = m.text || '';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flash).catch(()=>fallbackCopy(text, flash));
  }else{
    fallbackCopy(text, flash);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

function startEditMsg(idx){
  const thread = document.getElementById('thread');
  const msgEl = thread.children[idx];
  if(!msgEl) return;
  const bubble = msgEl.querySelector('.msg-bubble');
  const actions = msgEl.querySelector('.msg-actions');
  const original = state.messages[idx].text || '';
  bubble.style.display = 'none';
  if(actions) actions.style.display = 'none';
  const editBox = document.createElement('div');
  editBox.className = 'msg-edit-box';
  editBox.innerHTML = `
    <textarea id="editArea-${idx}">${escapeHtml(original)}</textarea>
    <div class="msg-edit-actions">
      <button class="btn ghost" onclick="cancelEditMsg(${idx})">Cancel</button>
      <button class="btn primary" onclick="saveEditMsg(${idx})">Save &amp; submit</button>
    </div>`;
  msgEl.insertBefore(editBox, bubble.nextSibling);
  const ta = document.getElementById(`editArea-${idx}`);
  ta.focus();
  ta.selectionStart = ta.value.length;
  autoResize(ta);
}
function cancelEditMsg(idx){
  const thread = document.getElementById('thread');
  const msgEl = thread.children[idx];
  if(!msgEl) return;
  const editBox = msgEl.querySelector('.msg-edit-box');
  if(editBox) editBox.remove();
  const bubble = msgEl.querySelector('.msg-bubble');
  const actions = msgEl.querySelector('.msg-actions');
  if(bubble) bubble.style.display='';
  if(actions) actions.style.display='';
}
function saveEditMsg(idx){
  const ta = document.getElementById(`editArea-${idx}`);
  if(!ta) return;
  const newText = ta.value.trim();
  if(!newText) return;
  const attachments = state.messages[idx].attachments || [];

  // Editing a message discards it and everything after it, then
  // resubmits — same as Claude's behaviour.
  state.messages = state.messages.slice(0, idx);
  const thread = document.getElementById('thread');
  while(thread.children.length > idx) thread.removeChild(thread.lastChild);

  submitUserText(newText, attachments);
}

function retryMsg(idx){
  // idx is an assistant message — drop it (and anything after) and
  // regenerate from the same preceding messages.
  state.messages = state.messages.slice(0, idx);
  const thread = document.getElementById('thread');
  while(thread.children.length > idx) thread.removeChild(thread.lastChild);
  const content = document.getElementById('content');
  content.scrollTop = content.scrollHeight;
  runAssistantTurn();
}

/* ---------- sources / citations from web search ---------- */
function renderSourcesInto(container, sources){
  if(!container || !sources || !sources.length) return;
  const div = document.createElement('div');
  div.className = 'msg-sources';
  const rows = sources.map((s, i)=>{
    let domain = s.url;
    try{ domain = new URL(s.url).hostname.replace(/^www\./,''); }catch(e){}
    return `<a class="msg-source-link" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">
      <span class="msg-source-num">${i+1}</span>
      <span class="msg-source-text">
        <span class="msg-source-title">${escapeHtml(s.title || domain)}</span>
        <span class="msg-source-domain">${escapeHtml(domain)}</span>
      </span>
    </a>`;
  }).join('');
  div.innerHTML = `<div class="msg-sources-label">Sources</div><div class="msg-sources-list">${rows}</div>`;
  container.appendChild(div);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function renderMarkdown(text){
  // marked converts markdown -> HTML; DOMPurify strips anything unsafe
  // before it's injected. Falls back to plain escaped text if either
  // CDN script failed to load (e.g. offline).
  if(typeof marked === 'undefined' || typeof DOMPurify === 'undefined'){
    return escapeHtml(text).replace(/\n/g,'<br>');
  }
  try{
    const raw = marked.parse(text || '', { breaks:true, gfm:true });
    return DOMPurify.sanitize(raw, { ADD_ATTR:['target'] });
  }catch(e){
    return escapeHtml(text).replace(/\n/g,'<br>');
  }
}

/* =========================================================
   API INTEGRATION — wired to OpenRouter's unified endpoint.
   Every agent in state.agents is just an OpenRouter model slug,
   so adding a model in the library is all it takes to use it here —
   no per-model code changes needed.
   ========================================================= */
const LANGUAGE_INSTRUCTIONS = {
  // 'auto' — no forced instruction; most current models (including the
  // ones in DEFAULT_AGENTS) understand and can reply in Malayalam on
  // their own if the user writes in Malayalam.
  ml: 'Respond only in Malayalam (മലയാളം) using Malayalam script, regardless of what language the user writes in. Keep code, commands, and technical identifiers in their original form.',
  en: 'Respond only in English, regardless of what language the user writes in.',
};

async function streamModel(messages, agent, thinkLevel, webSearch, language, onDelta){
  const chatMessages = messages.map(m=>({role:m.role, content:m.text}));
  const langInstruction = LANGUAGE_INSTRUCTIONS[language];
  if(langInstruction){
    chatMessages.unshift({ role:'system', content: langInstruction });
  }
  const body = {
    model: agent.id, // OpenRouter model slug, e.g. 'nvidia/nemotron-3-super-120b-a12b:free'
    reasoning: { effort: thinkLevel.toLowerCase() }, // supported by reasoning-capable models; ignored otherwise
    messages: chatMessages,
    stream: true // ask the proxy to stream tokens back as they're generated
  };
  if(webSearch){
    // OpenRouter's native web-search augmentation. This is a `plugins`
    // entry, not a `tools` entry — `tools` is for model-side function
    // calling, which most free/open-weight models don't support, and
    // "openrouter:web_search" was never a real tool type (it was
    // silently ignored, which is why answers looked unsearched and the
    // model sometimes hallucinated citation-looking text instead).
    // The plugin approach runs server-side on OpenRouter regardless of
    // whether the model itself supports tool calling.
    body.plugins = [{ id:'web', max_results:5 }];
  }

  let res;
  try{
    res = await fetch('/api/chat', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-access-code': localStorage.getItem('freeai_access_code') || ''
      },
      body: JSON.stringify(body)
    });
  }catch(err){
    return { text: `Couldn't reach the proxy (${err.message}). If you're opening this file locally, /api/chat won't work until it's deployed on Vercel — that's expected at this stage.`, sources: [] };
  }

  if(res.status===401){
    localStorage.removeItem('freeai_access_code');
    showLockScreen('That code stopped working. Enter it again.');
    return { text: "Access code needed — enter it in the screen that just appeared.", sources: [] };
  }
  if(!res.ok || !res.body){
    const errText = await res.text().catch(()=> '');
    if(webSearch && /plugin|web/i.test(errText)){
      return { text: `The web search plugin request failed. Turn off the search toggle and try again, or check the proxy error: ${errText.slice(0,200)}`, sources: [] };
    }
    return { text: `The proxy returned an error (${res.status}). ${errText.slice(0,200)}\n\nIf you're testing by opening this file directly in a browser (not deployed on Vercel yet), this is expected — /api/chat only works once it's deployed.`, sources: [] };
  }

  // Parse the SSE stream OpenRouter forwards (same "data: {...}" format
  // as OpenAI's streaming API) and hand each accumulated chunk to onDelta
  // so the caller can paint it immediately instead of waiting for [DONE].
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullText = '';
  // Web-search plugin results come back as OpenAI-style `url_citation`
  // annotations on the delta — collect and dedupe them by URL so they can
  // be rendered as a Claude-style "Sources" list once the reply is done.
  const sources = [];
  const seenUrls = new Set();
  try{
    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, { stream:true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // last (possibly incomplete) line stays buffered
      for(const line of lines){
        const trimmed = line.trim();
        if(!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if(!payload || payload === '[DONE]') continue;
        try{
          const json = JSON.parse(payload);
          const deltaObj = json?.choices?.[0]?.delta;
          const delta = deltaObj?.content || '';
          if(delta){
            fullText += delta;
            if(onDelta) onDelta(fullText);
          }
          const anns = deltaObj?.annotations || json?.choices?.[0]?.message?.annotations;
          if(anns && anns.length){
            for(const a of anns){
              const uc = a?.url_citation;
              if(uc?.url && !seenUrls.has(uc.url)){
                seenUrls.add(uc.url);
                sources.push({ url: uc.url, title: uc.title || '' });
              }
            }
          }
        }catch(e){ /* keep-alive / partial line — ignore and continue */ }
      }
    }
  }catch(err){
    if(!fullText) return { text: `Stream interrupted (${err.message}).`, sources };
  }
  return { text: fullText || 'No response received from the model.', sources };
}

/* ---------- access lock screen ---------- */
function showLockScreen(errorMsg){
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockError').textContent = errorMsg || '';
  document.getElementById('lockInput').value = '';
  document.getElementById('lockInput').focus();
}
function submitLockCode(){
  const code = document.getElementById('lockInput').value.trim();
  if(!code){
    document.getElementById('lockError').textContent = 'Enter a code to continue.';
    return;
  }
  localStorage.setItem('freeai_access_code', code);
  document.getElementById('lockScreen').style.display = 'none';
}
(function initLock(){
  const saved = localStorage.getItem('freeai_access_code');
  if(saved){
    document.getElementById('lockScreen').style.display = 'none';
  }
})();

/* ---------- settings modal (informational now — key lives server-side) ---------- */
function openSettings(){
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('open');
}

/* ---------- model library (live OpenRouter model list) ---------- */
function openLibrary(){
  closeAllPanels();
  document.getElementById('libraryOverlay').classList.add('open');
  if(!state.libraryModels){
    fetchModelLibrary();
  }else{
    renderLibrary(state.libraryModels);
  }
}
function closeLibrary(){
  document.getElementById('libraryOverlay').classList.remove('open');
}

async function fetchModelLibrary(){
  const listEl = document.getElementById('libList');
  listEl.innerHTML = `<div class="lib-status">Loading models from OpenRouter…</div>`;
  try{
    // Public endpoint — no API key required just to list models.
    const res = await fetch('https://openrouter.ai/api/v1/models');
    const data = await res.json();
    state.libraryModels = (data.data || []).sort((a,b)=> a.name.localeCompare(b.name));
    renderLibrary(state.libraryModels);
  }catch(err){
    listEl.innerHTML = `<div class="lib-status">Couldn't reach OpenRouter (${err.message}). Check your connection and try again.</div>`;
  }
}

function filterLibrary(){
  const q = document.getElementById('libSearchInput').value.trim().toLowerCase();
  if(!state.libraryModels) return;
  const filtered = !q ? state.libraryModels : state.libraryModels.filter(m =>
    m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q)
  );
  renderLibrary(filtered);
}

function renderLibrary(models){
  const listEl = document.getElementById('libList');
  if(!models.length){
    listEl.innerHTML = `<div class="lib-status">No models match that search.</div>`;
    return;
  }
  listEl.innerHTML = models.slice(0, 200).map(m=>{
    const added = state.agents.some(a=>a.id===m.id);
    const isFree = m.id.endsWith(':free') || (m.pricing && Number(m.pricing.prompt)===0 && Number(m.pricing.completion)===0);
    const ctx = m.context_length ? (m.context_length>=1000 ? Math.round(m.context_length/1000)+'K' : m.context_length) + ' context' : '';
    return `
      <div class="lib-row">
        <div class="lib-row-main">
          <div class="lib-row-name">${escapeHtml(m.name)}</div>
          <div class="lib-row-id">${escapeHtml(m.id)}</div>
          <div class="lib-row-meta ${isFree?'free':''}">${isFree?'FREE':'PAID'}${ctx?' · '+ctx:''}</div>
        </div>
        <button class="lib-add-btn ${added?'added':''}" onclick="${added?'':`addAgentFromLibrary('${escAttr(m.id)}','${escAttr(m.name)}')`}">${added?'Added ✓':'Add'}</button>
      </div>`;
  }).join('');
}

function addAgentFromLibrary(id, name){
  if(state.agents.some(a=>a.id===id)) return;
  const color = AGENT_COLORS[colorCursor % AGENT_COLORS.length];
  colorCursor++;
  state.agents.push({ id, name, color, tag:'', desc:'Added from your OpenRouter model library.' });
  state.agent = state.agents[state.agents.length-1];
  updateComposerButtons();
  if(state.libraryModels) renderLibrary(
    document.getElementById('libSearchInput').value.trim()
      ? state.libraryModels.filter(m=>{
          const q = document.getElementById('libSearchInput').value.trim().toLowerCase();
          return m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q);
        })
      : state.libraryModels
  );
}

/* ---------- init ---------- */
loadPersisted();
applyTheme(state.theme);
applyLanguageUI();
renderProjects();
renderChatList();
updateComposerButtons();
applyWebSearchUI();
if(window.matchMedia('(min-width:821px)').matches && localStorage.getItem('freeai_sidebar_collapsed') === '1'){
  toggleSidebarCollapse(true);
}
</script>
</body>
</html>
